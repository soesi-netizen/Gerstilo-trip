<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Reise-Begleiter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230A161E'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23D8A448' stroke-width='5'/%3E%3Cellipse cx='50' cy='50' rx='14' ry='34' fill='none' stroke='%23D8A448' stroke-width='4'/%3E%3Cline x1='16' y1='50' x2='84' y2='50' stroke='%23D8A448' stroke-width='4'/%3E%3Cline x1='21' y1='33' x2='79' y2='33' stroke='%23D8A448' stroke-width='3.5'/%3E%3Cline x1='21' y1='67' x2='79' y2='67' stroke='%23D8A448' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10202B;
    --bg-deep: #0A161E;
    --surface: #1B2E3A;
    --surface-hi: #24404F;
    --paper: #F6F1E2;
    --paper-dim: #E8E0CC;
    --ink: #1B2E3A;
    --gold: #D8A448;
    --gold-dim: #9A7A3C;
    --coral: #E8664F;
    --sage: #6FA98E;
    --transit: #5B9BC4;
    --text: #EDEAE0;
    --text-dim: #93A6AF;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, #16303F 0%, var(--bg-deep) 65%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header { padding: 28px 4px 18px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--text-dim); font-size: 14px; margin:0; }

  /* Route strip */
  .route-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 18px 4px 22px;
    scrollbar-width: none;
  }
  .route-strip::-webkit-scrollbar { display:none; }
  .stub {
    flex: 0 0 auto;
    min-width: 132px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .stub.active {
    border-color: var(--gold);
    background: var(--surface-hi);
  }
  .stub:active { transform: scale(0.97); }
  .stub .city {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 2px;
  }
  .stub .country { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .stub .dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold);
  }
  .stub-add {
    flex: 0 0 auto;
    min-width: 60px;
    border: 1px dashed rgba(255,255,255,0.25);
    border-radius: var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    color: var(--text-dim);
    cursor: pointer;
    background: transparent;
  }
  .stub-add:active { transform: scale(0.95); }

  /* Detail panel */
  .panel {
    background: var(--surface);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .panel-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .edit-btn {
    background:none; border:none; color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor:pointer; padding:4px 8px;
  }
  .notepad-toggle { cursor: pointer; }
  .note-section { margin-bottom: 4px; }
  .note-section-toggle {
    width:100%; text-align:left; background:none; border:none; color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
    padding: 9px 0; cursor:pointer; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .note-section:first-child .note-section-toggle { border-top: none; }
  .note-item { display:flex; align-items:flex-start; gap:10px; padding: 5px 0 5px 16px; }
  .note-text { flex:1; font-size: 13.5px; line-height: 1.4; cursor: pointer; }
  .note-del {
    background:none; border:none; color: var(--text-dim); opacity:0.5;
    font-size: 16px; cursor:pointer; padding: 0 4px; flex: 0 0 auto;
  }
  .note-del:active { opacity: 1; }
  .note-add-btn {
    background:none; border:none; color: var(--gold);
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em;
    padding: 6px 0 6px 16px; cursor:pointer;
  }

  /* Ticket stub styling for hotel card */
  .ticket {
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
  }
  .ticket:before, .ticket:after {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    background: var(--surface);
    border-radius: 50%;
    top: 50%; transform: translateY(-50%);
  }
  .ticket:before { left: -10px; }
  .ticket:after { right: -10px; }
  .ticket-compact { padding: 13px 16px 12px; }
  .ticket-compact .hotel-name { font-size: 16px; margin-bottom: 6px; }
  .ticket-compact .field { margin-bottom: 0; }
  .hotel-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 10px;
  }
  .field { margin-bottom: 10px; }
  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 2px;
  }
  .field-value {
    font-size: 14.5px;
    line-height: 1.4;
  }
  .field-value a { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--gold); }
  .field-row { display:flex; gap:10px; }
  .field-row .field { flex:1; }
  .divider-dash {
    border: none;
    border-top: 1.5px dashed var(--paper-dim);
    margin: 12px 0;
  }
  .notes-text { font-size: 13.5px; color: #3d4f4a; line-height: 1.5; }

  /* Itinerary list */
  .day-group { margin-bottom: 14px; }
  .day-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin: 18px 0 8px;
    padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .day-label:first-child { border-top:none; margin-top:0; }
  .item {
    display:flex;
    gap: 12px;
    padding: 9px 0;
    align-items: flex-start;
  }
  .item-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    min-width: 42px;
    padding-top: 1px;
    line-height: 1.4;
  }
  .item-endtime { font-size: 10.5px; opacity: 0.7; }
  .item-body { flex:1; cursor: pointer; }
  .item-title { font-size: 14px; font-weight: 500; }
  .item-title a { color: var(--text); text-decoration: none; border-bottom: 1.5px solid var(--gold); }
  .item-note { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .item-del {
    background:none; border:none; color: var(--text-dim); opacity:0.5;
    font-size: 16px; cursor:pointer; padding: 0 4px;
  }
  .item-del:active { opacity: 1; }

  .item.transport { border-left: 2px solid var(--transit); margin-left: -12px; padding-left: 10px; }
  .item.transport .item-time,
  .item.transport .item-title { color: var(--transit); }

  .drag-handle {
    background: none; border: none; color: var(--text-dim); opacity: 0.45;
    font-size: 14px; line-height: 1; cursor: grab; padding: 4px 2px;
    touch-action: none; user-select: none; flex: 0 0 auto; align-self: center;
  }
  .drag-handle:active { opacity: 0.9; cursor: grabbing; }
  .dragging { box-shadow: 0 6px 18px rgba(0,0,0,0.35); background: var(--surface-hi); border-radius: 8px; }
  .drag-lock {
    display: flex; align-items: center; justify-content: center;
    width: 20px; font-size: 11px; opacity: 0.35; flex: 0 0 auto; align-self: center;
  }

  .todo-item { display:flex; align-items:center; gap:10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .todo-item:last-child { border-bottom: none; }
  .todo-check {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--gold-dim); background: transparent; cursor: pointer;
    display:flex; align-items:center; justify-content:center; color: var(--gold); font-size: 12px;
    padding: 0;
  }
  .todo-item.done .todo-check { background: var(--gold); border-color: var(--gold); color: #2a1d05; }
  .todo-body { flex: 1; cursor: pointer; min-width: 0; }
  .todo-text { font-size: 14px; font-weight: 500; }
  .todo-text a { color: var(--text); text-decoration: none; border-bottom: 1.5px solid var(--gold); }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-dim); }
  .todo-badge { font-family:'IBM Plex Mono', monospace; font-size: 10.5px; margin-top: 2px; }
  .todo-badge.ready { color: var(--gold); }
  .todo-badge.future { color: var(--text-dim); }
  .todo-del {
    background:none; border:none; color: var(--text-dim); opacity:0.5;
    font-size: 16px; cursor:pointer; padding: 0 4px; flex: 0 0 auto;
  }
  .todo-del:active { opacity: 1; }

  .add-item-row {
    display:flex; gap:8px; margin-top: 12px; flex-wrap: wrap;
  }
  input, textarea, select {
    background: var(--bg-deep);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
  .settle-result {
    font-size: 15px; font-weight: 600; color: var(--gold);
    padding-top: 10px; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .ticket input {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--paper-dim);
    font-size: 14px;
  }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 8px;
    padding: 10px 14px;
    border: none;
    cursor: pointer;
  }
  .btn-gold { background: var(--gold); color: #2a1d05; font-weight: 600; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.15); }
  .btn-danger { background: transparent; color: var(--coral); border: 1px solid rgba(232,102,79,0.4); }
  .btn:active { transform: scale(0.97); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .modal-backdrop {
    position: fixed; inset:0; background: rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 50;
  }
  .modal {
    background: var(--surface-hi);
    width:100%; max-width: 560px;
    border-radius: 20px 20px 0 0;
    padding: 22px 18px 26px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .modal h3 { font-family:'Space Grotesk',sans-serif; margin: 0 0 14px; font-size: 18px; }
  .modal-field { margin-bottom: 10px; }
  .modal-field label {
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--text-dim); margin-bottom: 4px;
  }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions .btn { flex:1; }

  .fab {
    position: fixed;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--gold);
    color: #2a1d05;
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(216,164,72,0.35);
    cursor: pointer;
    z-index: 40;
  }
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 4px 0 8px;
  }
  .auth-sub {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0 0 20px;
    line-height: 1.4;
  }
  .auth-denied {
    color: var(--coral);
    font-size: 13.5px;
    margin: 10px 0 18px;
    line-height: 1.4;
  }

  .countdown {
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--bg-deep);
    border: 1px solid rgba(216,164,72,0.25);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 4px 0 6px;
  }
  .countdown-bottom { margin: 22px 0 12px; }
  .countdown-num {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 34px;
    color: var(--gold);
    letter-spacing: 0.02em;
    min-width: 0;
  }
  .countdown-label {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.3;
  }

  .budget-tile { display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; cursor:pointer; }
  .budget-bar { flex:1; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
  .budget-bar-fill { height:100%; border-radius:3px; transition:width 0.3s ease; }

  .tab-bar { display:flex; gap:8px; margin: 18px 0 20px; }
  .tab-btn {
    flex:1; text-align:center; padding:10px; border-radius:10px;
    background: var(--surface); border:1px solid rgba(255,255,255,0.06);
    color: var(--text-dim); font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
  }
  .tab-btn.active { background: var(--surface-hi); border-color: var(--gold); color: var(--text); }

  .expense-item { display:flex; align-items:center; gap:10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .expense-item:last-child { border-bottom: none; }
  .expense-body { flex:1; cursor: pointer; min-width: 0; }
  .expense-text { font-size: 14px; font-weight: 500; }
  .expense-date { font-size: 11px; color: var(--text-dim); font-family:'IBM Plex Mono', monospace; margin-top: 1px; }
  .expense-amount { font-family:'IBM Plex Mono', monospace; font-size: 14px; color: var(--gold); flex: 0 0 auto; white-space: nowrap; }
  .expense-del {
    background:none; border:none; color: var(--text-dim); opacity:0.5;
    font-size: 16px; cursor:pointer; padding: 0 4px; flex: 0 0 auto;
  }
  .expense-del:active { opacity: 1; }

  .fab:active { transform: translateX(-50%) scale(0.96); }

  .status-banner {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-align:center;
    padding: 6px 0 0;
    min-height: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .army-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .army-heart {
    position: absolute; bottom: -40px; opacity: 0;
    animation: armyFloat 3.2s ease-in forwards;
  }
  @keyframes armyFloat {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-100vh) scale(1.1); opacity: 0; }
  }
  .army-message {
    position: relative; text-align: center; color: #C9A0F5;
    text-shadow: 0 0 18px rgba(201,160,245,0.6);
    animation: armyMsg 3.4s ease forwards;
  }
  .army-message .kr {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 34px; display: block; margin-bottom: 6px;
  }
  .army-message .en {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim);
  }
  @keyframes armyMsg {
    0% { opacity: 0; transform: scale(0.85); }
    12% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  .member-badge-solo {
    position: fixed; z-index: 998; pointer-events: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #C9A0F5, #8B6FD1);
    color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(139,111,209,0.55);
    transform: translate(-50%, -100%) scale(0.5);
    opacity: 0;
  }
  .member-badge-solo.member-badge-photo {
    width: 40px; height: 40px; overflow: hidden; padding: 0;
    border: 2px solid #C9A0F5;
  }
  .member-badge-solo.member-badge-photo img {
    width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%;
  }
  .member-badge-solo.pop { animation: memberPopSolo 0.22s ease-out; }
  .member-badge-solo.fadeout {
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 0; transform: translate(-50%, -140%) scale(0.85);
  }
  @keyframes memberPopSolo {
    0% { transform: translate(-50%, -100%) scale(0.5); opacity: 0.4; }
    55% { transform: translate(-50%, -112%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card" id="authCard">
    <p class="eyebrow">Reise-Begleiter</p>
    <h2>Anmeldung nötig</h2>
    <p class="auth-sub">Nur für euch zwei — meldet euch mit Google an.</p>
    <button class="btn btn-gold" id="googleSignInBtn" style="width:100%;padding:13px;">Mit Google anmelden</button>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <header>
    <p class="eyebrow" id="tripEyebrow">Reiseroute · Sept 2026</p>
    <h1 id="tripTitle">Singapur → Indonesien</h1>
    <div class="countdown" id="countdown"></div>
    <p class="sub">Tippt eine Station an für Hotel, Kontakt & Plan · geteilter Stand für euch beide</p>
  </header>

  <div class="tab-bar" id="tabBar"></div>

  <div id="tripTab">
    <div id="todoArea"></div>
    <div class="route-strip" id="routeStrip"></div>
    <div id="detailArea"></div>
  </div>

  <div id="budgetTab"></div>

  <div class="countdown countdown-bottom" id="bottomTile"></div>

  <div class="status-banner" id="statusBanner"></div>
</div>

<button class="fab" id="addStopFab">+ Station hinzufügen</button>

<div id="modalRoot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Firebase-Config für "Gerstilo Trip"
  const firebaseConfig = {
    apiKey: "AIzaSyCow2gRrkJCsRBFi9RBKbZk2Z3vjRA8w-U",
    authDomain: "gerstilo-trip.firebaseapp.com",
    projectId: "gerstilo-trip",

  // Sortierschlüssel aus freiem Datumstext wie "Fr 11.9." oder "Sa 3.10." (Tag.Monat)
  function dayKey(dateStr){
    const m = /(\d{1,2})\.(\d{1,2})\.?/.exec(dateStr || '');
    if(!m) return null;
    return parseInt(m[2],10) * 100 + parseInt(m[1],10); // Monat, dann Tag
  }

  // Uhrzeit wie "16:55" oder "9:00" in Minuten seit Mitternacht; null wenn nicht erkennbar
  function parseTimeMinutes(timeStr){
    const m = /^(\d{1,2}):(\d{2})$/.exec((timeStr || '').trim());
    if(!m) return null;
    return parseInt(m[1],10) * 60 + parseInt(m[2],10);
  }

  function fmtTimeFromMinutes(totalMinutes){
    const t = Math.max(0, Math.min(1439, Math.round(totalMinutes)));

  }

  // Nach dem Verschieben eines Programmpunkts die Uhrzeit an die neuen Nachbarn im selben Tag anpassen
  function adjustTimeToNeighbors(stop, item){
    const dayItems = stop.itinerary.filter(it => it.date === item.date);
    const idx = dayItems.indexOf(item);
    const prevItem = idx > 0 ? dayItems[idx - 1] : null;
    const nextItem = idx < dayItems.length - 1 ? dayItems[idx + 1] : null;

    // Untere Grenze: Ende des vorherigen Punkts (oder dessen Beginn, falls keine Endzeit gesetzt) —
    // so entsteht keine Überschneidung mit einer noch laufenden Aktivität.
    const prevBound = prevItem ? (parseTimeMinutes(prevItem.endTime) ?? parseTimeMinutes(prevItem.time)) : null;
    const nextBound = nextItem ? parseTimeMinutes(nextItem.time) : null;

    const ownStart = parseTimeMinutes(item.time);
    const ownEnd = parseTimeMinutes(item.endTime);
    const duration = (ownStart != null && ownEnd != null && ownEnd > ownStart) ? ownEnd - ownStart : null;

    let newStart = null;
    if(prevBound != null && nextBound != null && nextBound > prevBound){
      newStart = Math.round((prevBound + nextBound) / 2 / 5) * 5; // Mitte der Lücke, auf 5 Min. gerundet
      if(duration != null && newStart + duration > nextBound){
        newStart = Math.max(prevBound, nextBound - duration); // eigene Dauer noch in die Lücke quetschen
      }
    } else if(prevBound != null){
      newStart = prevBound + 30;
    } else if(nextBound != null){
      newStart = nextBound - (duration != null ? duration : 30);
    }

    if(newStart != null){
      item.time = fmtTimeFromMinutes(newStart);
      if(duration != null) item.endTime = fmtTimeFromMinutes(newStart + duration); // Dauer beibehalten
    }
  }

  // Setzt ein Element (z.B. einen Transport-Programmpunkt mit fester Zeit) an die zeitlich
  // passende Stelle innerhalb seines Tages — für Elemente, die nicht per Drag verschoben werden,
  // sondern nur über eine manuelle Datums-/Uhrzeit-Änderung ihre Position bekommen sollen.
  function repositionByTime(stop, item){
    const others = stop.itinerary.filter(it => it !== item);
    const dayItems = others.filter(it => it.date === item.date);
    const key = parseTimeMinutes(item.time);
    const nextInDay = dayItems.find(di => {
      const k = parseTimeMinutes(di.time);
      return key != null && k != null && k > key;
    });
    let insertIndex;
    if(nextInDay){
      insertIndex = others.indexOf(nextInDay);
    } else {
      const lastOfDay = dayItems[dayItems.length - 1];
      insertIndex = lastOfDay ? others.indexOf(lastOfDay) + 1 : others.length;
    }
    others.splice(insertIndex, 0, item);
    stop.itinerary = others;
  }

  function sortByKey(arr, keyFn){
    // stabiler Sort: Einträge ohne erkennbaren Schlüssel bleiben an ihrer relativen Position, aber ans Ende
    return arr
      .map((item, i) => ({ item, i, key: keyFn(item) }))
      .sort((a, b) => {
        if(a.key === null && b.key === null) return a.i - b.i;
        if(a.key === null) return 1;
        if(b.key === null) return -1;
        return a.key - b.key || a.i - b.i;
      })
      .map(x => x.item);
  }

  // Heutiges Datum als lokales YYYY-MM-DD (ohne Zeitzonen-Umrechnung)
  function todayISO(){

  // Rechnet auf einem YYYY-MM-DD-Datum in reiner Kalendertag-Arithmetik (UTC-basiert, zeitzonensicher)
  function addDaysISO(iso, deltaDays){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d));
    dt.setUTCDate(dt.getUTCDate() + deltaDays);
    return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth()+1).padStart(2,'0') + '-' + String(dt.getUTCDate()).padStart(2,'0');
  }

  /* ---- Drag & Drop Neuordnung (Pointer Events, funktioniert mit Maus & Touch) ----
     Elemente brauchen: [data-drag-item] data-drag-group="<Gruppenschlüssel>" data-drag-id="<id>"
     und darin einen ".drag-handle" zum Anfassen. Ziehen ist über Gruppengrenzen hinweg möglich
     (z.B. ein Programmpunkt von einem Tag auf einen anderen) — dabei übernimmt das Element die
     Gruppe seines neuen Nachbarn.
     onReorder(orderedIds, draggedId, newGroup) bekommt die neue Gesamtreihenfolge aller Elemente
     im Container sowie die (ggf. neue) Gruppe des verschobenen Elements. */
  const DRAG_HOLD_MS = 500; // wie bei iOS/Android-Standardgesten: 500ms halten, bevor das Verschieben losgeht
  const DRAG_HOLD_TOLERANCE = 12; // px Fingerwackeln, das während der Haltezeit toleriert wird

  function attachDragReorder(container, onReorder){
    let ctx = null;

    container.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('pointerdown', (e) => onPointerDown(e, handle));
    });

    // Wartet DRAG_HOLD_MS, bevor das eigentliche Verschieben losgeht — kurzes Antippen oder ein
    // Wisch-Scroll über den Griff hinweg löst so noch kein versehentliches Verschieben aus.
    function onPointerDown(e, handle){
      const startX = e.clientX, startY = e.clientY, pointerId = e.pointerId;
      let holdTimer = setTimeout(() => {
        holdTimer = null;
        cleanupPending();
        beginDrag(handle, pointerId, startY);
      }, DRAG_HOLD_MS);

      const onPendingMove = (ev) => {
        if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > DRAG_HOLD_TOLERANCE) cleanupPending();
      };
      function cleanupPending(){
        if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
        handle.removeEventListener('pointermove', onPendingMove);
        handle.removeEventListener('pointerup', cleanupPending);
        handle.removeEventListener('pointercancel', cleanupPending);
      }
      handle.addEventListener('pointermove', onPendingMove);
      handle.addEventListener('pointerup', cleanupPending, { once:true });
      handle.addEventListener('pointercancel', cleanupPending, { once:true });
    }

    function beginDrag(handle, pointerId, startY){
      const itemEl = handle.closest('[data-drag-item]');
      const allItems = Array.from(container.querySelectorAll('[data-drag-item]'));
      const rects = allItems.map(el => el.getBoundingClientRect());
      const curIndex = allItems.indexOf(itemEl);
      ctx = {
        handle, itemEl, allItems,
        centers: rects.map(r => r.top + r.height / 2),
        itemH: rects[curIndex].height,
        startY,
        curIndex,
        targetIndex: curIndex
      };
      itemEl.classList.add('dragging');
      handle.setPointerCapture(pointerId);
      handle.addEventListener('pointermove', onDragMove);
      handle.addEventListener('pointerup', onDragEnd, { once:true });
      handle.addEventListener('pointercancel', onDragEnd, { once:true });
    }

    function onDragMove(e){
      if(!ctx) return;
      e.preventDefault(); // verhindert, dass währenddessen noch die Seite scrollt
      const dy = e.clientY - ctx.startY;
      ctx.itemEl.style.transform = `translateY(${dy}px)`;

      // Zielposition = Anzahl anderer Elemente, deren (unveränderter) Mittelpunkt über dem
      // aktuellen, verschobenen Mittelpunkt des gezogenen Elements liegt.
      const draggedCenter = ctx.centers[ctx.curIndex] + dy;
      let target = 0;
      ctx.allItems.forEach((el, i) => {
        if(i !== ctx.curIndex && ctx.centers[i] < draggedCenter) target++;
      });

      if(target !== ctx.targetIndex){
        ctx.targetIndex = target;
        ctx.allItems.forEach((el, i) => {
          if(i === ctx.curIndex) return;
          const oi = i < ctx.curIndex ? i : i - 1; // Index unter den "anderen" Elementen
          const finalIndex = oi < target ? oi : oi + 1; // Position im neuen Gesamtarray
          const delta = finalIndex - i;
          el.style.transform = delta ? `translateY(${delta * ctx.itemH}px)` : '';
          el.style.transition = 'transform 0.15s ease';
        });
      }
    }

    function onDragEnd(e){
      if(!ctx) return;
      const { handle, itemEl, allItems, curIndex, targetIndex } = ctx;
      allItems.forEach(el => { el.style.transform=''; el.style.transition=''; });
      itemEl.classList.remove('dragging');
      handle.removeEventListener('pointermove', onDragMove);

      if(targetIndex !== curIndex){
        const others = allItems.filter((_, i) => i !== curIndex);
        const otherIds = others.map(el => el.dataset.dragId);
        const otherGroups = others.map(el => el.dataset.dragGroup);
        const draggedId = itemEl.dataset.dragId;

        const orderedIds = [...otherIds.slice(0, targetIndex), draggedId, ...otherIds.slice(targetIndex)];
        // Neue Gruppe: die des Nachbarn, der jetzt folgt (oder des letzten, falls ganz ans Ende verschoben)
        const newGroup = targetIndex < otherGroups.length ? otherGroups[targetIndex] : otherGroups[otherGroups.length - 1];

        onReorder(orderedIds, draggedId, newGroup);
      }
      ctx = null;
    }
  }

    document.getElementById('tripTitle').textContent = state.tripName;

      renderBudgetTab();
    }
  }

  function renderTabBar(){
    const el = document.getElementById('tabBar');
    el.innerHTML = `
      <button class="tab-btn ${activeTab === 'trip' ? 'active' : ''}" id="tabTrip">Reise</button>
      <button class="tab-btn ${activeTab === 'budget' ? 'active' : ''}" id="tabBudget">Budget</button>
    `;
    document.getElementById('tabTrip').onclick = () => { activeTab = 'trip'; render(); };
    document.getElementById('tabBudget').onclick = () => { activeTab = 'budget'; render(); };
  }

  // Vor der Abreise: Countdown oben, Budget-Vorschau unten. Ab dem Abreisetag: umgekehrt.
  function renderTiles(){
    const topEl = document.getElementById('countdown');
    const bottomEl = document.getElementById('bottomTile');
    if(!state.tripStartDate || !state.tripEndDate){ topEl.innerHTML = ''; bottomEl.innerHTML = ''; return; }
    const now = new Date();
    now.setHours(0,0,0,0);
    const start = new Date(state.tripStartDate + 'T00:00:00');

    if(now < start){
      topEl.innerHTML = countdownContent();
      renderBudgetTile(bottomEl);
    } else {
      renderBudgetTile(topEl);
      bottomEl.innerHTML = countdownContent();
    }
  }

  function countdownContent(){
    const now = new Date();
    now.setHours(0,0,0,0);
    const start = new Date(state.tripStartDate + 'T00:00:00');
    const end = new Date(state.tripEndDate + 'T00:00:00');
    const dayMs = 86400000;
    let num, label;
    if(now < start){
      const days = Math.ceil((start - now) / dayMs);
      num = days;
      label = (days === 1 ? 'Tag' : 'Tage') + ' bis zur Abreise';
    } else if(now <= end){
      const days = Math.ceil((end - now) / dayMs);
      num = days;
      label = 'Reise läuft ✈ · noch ' + days + (days === 1 ? ' Tag' : ' Tage') + ' bis daheim';
    } else {
      num = '✓';
      label = 'Reise beendet';
    }
    return `<div class="countdown-num">${num}</div><div class="countdown-label">${label}</div>`;
  }

  function fmtEUR(n){
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n || 0);
  }

  function personLabel(id){
    return id === 'christine' ? 'Christine' : 'Florian';
  }

  // Wer hat bezahlt vs. wessen Anteil war es — daraus ergibt sich, wer wem noch etwas schuldet.
  function computeSettlement(){
    const paid = { florian: 0, christine: 0 };
    const owed = { florian: 0, christine: 0 };
    (state.expenses || []).forEach(e => {
      const payer = e.paidBy === 'christine' ? 'christine' : 'florian';
      paid[payer] += e.amount;
      if(e.splitFor === 'florian') owed.florian += e.amount;
      else if(e.splitFor === 'christine') owed.christine += e.amount;
      else { owed.florian += e.amount / 2; owed.christine += e.amount / 2; }
    });
    // positiv = hat mehr bezahlt als der eigene Anteil war -> bekommt Geld zurück
    const balance = { florian: paid.florian - owed.florian, christine: paid.christine - owed.christine };
    return { paid, owed, balance };
  }

  function renderBudgetTile(el){
    const total = (state.expenses || []).reduce((s, e) => s + e.amount, 0);
    const budget = state.budgetTotal || 0;
    const remaining = budget - total;
    const pct = budget > 0 ? Math.min(100, Math.round((total / budget) * 100)) : 0;
    el.innerHTML = `
      <div class="budget-tile" id="budgetTileLink">
        <div>
          <div class="countdown-num" style="font-size:22px;">${fmtEUR(total)}</div>
          <div class="countdown-label">${budget > 0 ? `von ${fmtEUR(budget)} ausgegeben` : 'Ausgaben bisher'}</div>
        </div>
        ${budget > 0 ? `<div class="budget-bar"><div class="budget-bar-fill" style="width:${pct}%;background:${remaining < 0 ? 'var(--coral)' : 'var(--gold)'}"></div></div>` : ''}
      </div>
    `;
    document.getElementById('budgetTileLink').onclick = () => { activeTab = 'budget'; render(); };
  }

  function renderTodoRow(t, today, draggable){
    let badge = '';
    if(!t.done && t.doableFrom){
      badge = t.doableFrom <= today
        ? '<div class="todo-badge ready">🔔 Jetzt möglich</div>'
        : `<div class="todo-badge future">ab ${fmtDay(t.doableFrom)} möglich</div>`;
    }
    const textHtml = t.link
      ? `<a href="${escapeHtml(normalizeUrl(t.link))}" target="_blank" rel="noopener">${escapeHtml(t.text)}</a>`
      : escapeHtml(t.text);
    const dragAttrs = draggable ? `data-drag-item data-drag-group="todos" data-drag-id="${t.id}"` : '';
    return `
      <div class="todo-item ${t.done ? 'done' : ''}" ${dragAttrs}>
        ${draggable ? '<button class="drag-handle" aria-label="Verschieben">⠿</button>' : '<span style="width:20px;flex:0 0 auto;"></span>'}
        <button class="todo-check" data-id="${t.id}">${t.done ? '✓' : ''}</button>
        <div class="todo-body" data-id="${t.id}">
          <div class="todo-text">${textHtml}</div>
          ${badge}
        </div>
        <button class="todo-del" data-id="${t.id}">×</button>
      </div>
    `;
  }

  // Sortierschlüssel aus dem "ab wann möglich"-Datum (YYYY-MM-DD -> Zahl); ohne Datum ganz ans Ende
  function todoDateKey(t){
    return t.doableFrom ? parseInt(t.doableFrom.replace(/-/g, ''), 10) : null;
  }

  function renderTodos(){
    const el = document.getElementById('todoArea');
    const todos = state.todos || [];
    const today = todayISO();
    const openTodos = sortByKey(todos.filter(t => !t.done), todoDateKey);
    const doneTodos = sortByKey(todos.filter(t => t.done), todoDateKey);

    el.innerHTML = `
      <div class="panel">
        <div class="panel-title"><span>To-Do vor der Reise</span></div>
        ${openTodos.length ? openTodos.map(t => renderTodoRow(t, today, true)).join('') : '<div class="empty" style="padding:12px 0;">Noch keine offenen To-Dos.</div>'}
        ${doneTodos.length ? `
          <button class="edit-btn" id="toggleDoneBtn" style="margin-top:8px;">${todosShowDone ? '▾' : '▸'} Erledigt (${doneTodos.length})</button>
          ${todosShowDone ? doneTodos.map(t => renderTodoRow(t, today, false)).join('') : ''}
        ` : ''}
        <button class="btn btn-ghost" id="addTodoBtn" style="margin-top:14px;width:100%;">+ To-Do hinzufügen</button>
      </div>
    `;

    document.getElementById('addTodoBtn').onclick = () => openTodoModal();
    if(doneTodos.length){
      document.getElementById('toggleDoneBtn').onclick = () => { todosShowDone = !todosShowDone; renderTodos(); };
    }
    el.querySelectorAll('.todo-check').forEach(btn => {
      btn.onclick = () => {
        const t = state.todos.find(x => x.id === btn.dataset.id);
        if(!t) return;
        const wasDone = t.done;
        t.done = !t.done;
        if(!wasDone && t.done){
          const rect = btn.getBoundingClientRect();
          showMemberBurst(rect.left + rect.width / 2, rect.top);
        }
        saveState(); render();
      };
    });
    el.querySelectorAll('.todo-body').forEach(bodyEl => {
      bodyEl.onclick = (e) => {
        if(e.target.closest('a')) return; // Link direkt öffnen lassen statt Bearbeiten-Modal
        const t = state.todos.find(x => x.id === bodyEl.dataset.id);
        if(t) openTodoModal(t);
      };
    });
    el.querySelectorAll('.todo-del').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.todos = state.todos.filter(t => t.id !== btn.dataset.id);
        saveState(); render();
      };
    });

    attachDragReorder(el, (orderedIds) => {
      const byId = Object.fromEntries(state.todos.map(t => [t.id, t]));
      // Erledigte (nicht ziehbare) To-Dos bleiben unverändert, nur die offene Reihenfolge wird übernommen
      const reorderedOpen = orderedIds.map(id => byId[id]);
      state.todos = [...reorderedOpen, ...doneTodos];
      saveState(); render();
    });
  }

  function renderBudgetTab(){
    const el = document.getElementById('budgetTab');
    const expenses = [...(state.expenses || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const total = (state.expenses || []).reduce((s, e) => s + e.amount, 0);
    const budget = state.budgetTotal || 0;
    const remaining = budget - total;
    const pct = budget > 0 ? Math.min(100, Math.round((total / budget) * 100)) : 0;
    const { paid, balance } = computeSettlement();

    let settleText;
    if(Math.abs(balance.florian) < 0.005) settleText = 'Ausgeglichen — niemand schuldet etwas.';
    else if(balance.florian > 0) settleText = `Christine schuldet Florian ${fmtEUR(balance.florian)}`;
    else settleText = `Florian schuldet Christine ${fmtEUR(-balance.florian)}`;

    el.innerHTML = `
      <div class="panel">
        <div class="panel-title">
          <span>Budget</span>
          <button class="edit-btn" id="editBudgetBtn">Budget bearbeiten</button>
        </div>
        <div class="countdown-num" style="font-size:28px;">${fmtEUR(total)}</div>
        <div class="countdown-label">ausgegeben${budget > 0 ? ` · ${fmtEUR(budget)} Budget · ${fmtEUR(remaining)} übrig` : ''}</div>
        ${budget > 0 ? `<div class="budget-bar" style="margin-top:10px;"><div class="budget-bar-fill" style="width:${pct}%;background:${remaining < 0 ? 'var(--coral)' : 'var(--gold)'}"></div></div>` : ''}
      </div>

      <div class="panel">
        <div class="panel-title"><span>Abrechnung</span></div>
        <div class="field-row">
          <div class="field">
            <div class="field-label">Florian bezahlt</div>
            <div class="field-value">${fmtEUR(paid.florian)}</div>
          </div>
          <div class="field">
            <div class="field-label">Christine bezahlt</div>
            <div class="field-value">${fmtEUR(paid.christine)}</div>
          </div>
        </div>
        <div class="settle-result">${escapeHtml(settleText)}</div>
      </div>

      <div class="panel">
        <div class="panel-title"><span>Ausgaben</span></div>
        ${expenses.length ? expenses.map(e => `
          <div class="expense-item">

              <div class="expense-text">${escapeHtml(e.text)}</div>
              <div class="expense-date">${fmtDay(e.date)} · ${personLabel(e.paidBy)} bezahlt${e.splitFor && e.splitFor !== 'both' ? ' für ' + personLabel(e.splitFor) : ' · geteilt'}</div>
            </div>
            <div class="expense-amount">${fmtEUR(e.amount)}</div>
            <button class="expense-del" data-id="${e.id}">×</button>
          </div>
        `).join('') : '<div class="empty" style="padding:12px 0;">Noch keine Ausgaben erfasst.</div>'}
        <button class="btn btn-ghost" id="addExpenseBtn" style="margin-top:14px;width:100%;">+ Ausgabe hinzufügen</button>
      </div>
    `;

    document.getElementById('editBudgetBtn').onclick = () => openBudgetModal();
    document.getElementById('addExpenseBtn').onclick = () => openExpenseModal();
    el.querySelectorAll('.expense-body').forEach(bodyEl => {
      bodyEl.onclick = () => {
        const ex = state.expenses.find(x => x.id === bodyEl.dataset.id);
        if(ex) openExpenseModal(ex);
      };
    });
    el.querySelectorAll('.expense-del').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.expenses = state.expenses.filter(x => x.id !== btn.dataset.id);
        saveState(); render();
      };
    });
  }

  // Notizbuch pro Station: lose Ideen/Empfehlungen, in frei wählbaren Kategorien, alles einklappbar
  function renderNotepadPanel(stop){
    const ideas = stop.ideas || [];
    // Standard-Kategorien immer anzeigen (auch leer), plus alle bereits benutzten eigenen Kategorien
    const sections = [...new Set([...DEFAULT_NOTE_SECTIONS, ...ideas.map(n => n.section)])];

              <div class="field">
                <div class="field-label">Telefon</div>

        adjustTimeToNeighbors(stop, moved); // Uhrzeit an neue Position im Tag anpassen
      }
      saveState(); render();
    });
  }

  function openIdeaModal(stop, note, presetSection){

        stop.itinerary = stop.itinerary.filter(i => i.id !== item.id);
        saveState(); render(); closeModal();
      };

    document.getElementById('saveBtn').onclick = () => {
      const title = document.getElementById('f_title').value.trim();
      if(!title) return;
      const date = document.getElementById('f_date').value.trim() || 'Ohne Datum';
      const time = document.getElementById('f_time').value.trim();
      const endTime = document.getElementById('f_endtime').value.trim();
      const link = document.getElementById('f_link').value.trim();
      const note = document.getElementById('f_note').value.trim();
      const isTransport = document.getElementById('f_transport').checked;
      const isFixed = document.getElementById('f_fixed').checked;
      if(isEdit){
        item.date = date; item.time = time; item.endTime = endTime; item.title = title; item.link = link; item.note = note;
        item.isTransport = isTransport; item.isFixed = isFixed;
        if(isTransport || isFixed) repositionByTime(stop, item); // feste Zeit -> Position richtet sich nach der Uhrzeit, nicht nach Drag
      } else {
        const newItem = { id: uid(), date, time, endTime, title, link, note, isTransport, isFixed };
        stop.itinerary.push(newItem);
        if(isTransport || isFixed) repositionByTime(stop, newItem);
      }
      saveState(); render(); closeModal();
    };
  }

  const BTS_MEMBERS = [
    { code: 'RM', photo: null },
    { code: 'Jin', photo: null },
    { code: 'SUGA', photo: null },
    { code: 'J-H', photo: null },
    { code: 'JM', photo: PHOTO_JM },
    { code: 'V', photo: null },
    { code: 'JK', photo: null }
  ];
  let lastMember = null; // damit nie zweimal hintereinander dasselbe Mitglied auftaucht

  function showMemberBurst(x, y){
    const choices = BTS_MEMBERS.filter(m => m.code !== lastMember);
    const member = choices[Math.floor(Math.random() * choices.length)];
    lastMember = member.code;

    const badge = document.createElement('span');
    badge.className = 'member-badge-solo pop';
    if(member.photo){
      badge.classList.add('member-badge-photo');
      badge.innerHTML = '<img src="' + member.photo + '" alt="' + member.code + '">';
    } else {
      badge.textContent = member.code;
    }
    badge.style.left = x + 'px';
    badge.style.top = y + 'px';
    document.body.appendChild(badge);

    setTimeout(() => {
      badge.classList.add('fadeout');
      setTimeout(() => badge.remove(), 300);
    }, 700);
  }

  if (window.db) { initAuthGate(); } else { window.addEventListener('firebaseReady', initAuthGate); }
})();
